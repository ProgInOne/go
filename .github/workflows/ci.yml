name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @proginone/* from GitHub Packages (JS D-090)

jobs:
  # GitHub-hosted runners only: this repository is public, so a self-hosted runner would run
  # anyone's pull request on the owner's machine (G-001).
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # main only takes release PRs from develop (CONTRIBUTING.md#develop과-main).
      - name: Release PRs to main come from develop
        # A fork's branch named develop is not this repository's develop.
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::PRs into main must come from this repository's develop (got '${HEAD_REPO}:${HEAD_REF}'). Target develop instead."
          exit 1
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@proginone'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # go-runner tests compile and run real Go (G-002); content outputs are checked with this version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules
        run: pnpm check:deps

      - name: Test
        run: pnpm test

      - name: Content check
        run: pnpm content:check

      - name: Build
        run: pnpm build

      # First-load bundle budget (JS D-064): byte counts, so not flaky like a timing threshold.
      - name: Bundle budget
        run: pnpm check:bundle

      - name: Docs links
        run: pnpm check:links

      - name: Audit (high+)
        run: pnpm audit --prod --audit-level high

  # Browser E2E, visual regression and accessibility on the production build (G-001: the second
  # required check). Visual baselines come from this same image (tools/e2e-docker.sh,
  # .github/workflows/visual-baselines.yml).
  e2e:
    name: e2e · visual · a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    env:
      HOME: /root # Firefox/Chromium expect a writable HOME when running as root
      PW_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@proginone'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lesson examples run on the real Go in the E2E server (G-002).
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - run: pnpm build

      # The real content must build too (the suite itself reads the fixture pack, e2e/fixtures).
      - name: Content build
        run: pnpm content:build

      - name: Playwright
        working-directory: e2e
        run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # New screenshots (a missing baseline is written next to the spec) come along too.
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/tests/__screenshots__
          retention-days: 7
