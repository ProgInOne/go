# Go 오개념

# ── first-program ──

- id: go.mc.top-function-runs-first
  concept: go.basics.program-structure
  title: 파일 맨 위 함수부터 실행된다고 생각함
  statement: 파일에서 가장 먼저 적힌 함수가 먼저 실행된다고 생각한다.
  reality: 프로그램은 main 패키지의 main 함수에서 시작한다. 다른 함수는 main에서(또는 main이 부른 함수에서) 부를 때만 실행된다. (패키지 변수 초기화와 init 함수는 main보다 먼저 실행되지만, 입문 단원의 프로그램에는 나오지 않는다.)
  remediation:
    lessonSection: go-basics.start.first-program#pitfalls

- id: go.mc.println-without-import
  concept: go.basics.println
  title: import 없이 fmt.Println을 쓸 수 있다고 생각함
  statement: fmt.Println은 언제나 쓸 수 있는 명령이라 import "fmt"가 없어도 된다고 생각한다.
  reality: 'fmt는 표준 라이브러리 패키지라서 import "fmt"로 가져와야 쓸 수 있다. 가져오지 않으면 undefined: fmt 컴파일 오류가 난다.'
  remediation:
    lessonSection: go-basics.start.first-program#pitfalls

# ── variables ──

- id: go.mc.short-decl-reassigns
  concept: go.vars.short-declaration
  title: := 로 기존 변수의 값을 바꿀 수 있다고 생각함
  statement: 이미 선언한 변수에 다시 x := 2 처럼 쓰면 값이 바뀐다고 생각한다.
  reality: := 는 새 변수를 만든다. 같은 범위에서 왼쪽에 새 변수가 하나도 없으면 no new variables on left side of := 컴파일 오류가 난다. 값을 바꿀 때는 x = 2 처럼 = 를 쓴다.
  remediation:
    lessonSection: go-basics.start.variables#pitfalls

- id: go.mc.unused-variable-ok
  concept: go.vars.short-declaration
  title: 쓰지 않는 변수를 남겨 둬도 된다고 생각함
  statement: 변수를 선언만 하고 쓰지 않아도 프로그램은 문제없이 실행된다고 생각한다.
  reality: Go는 함수 안에서 선언하고 쓰지 않은 변수가 있으면 declared and not used 컴파일 오류를 내고 실행하지 않는다.
  remediation:
    lessonSection: go-basics.start.variables#pitfalls
