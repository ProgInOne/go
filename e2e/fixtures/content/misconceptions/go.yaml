- id: go.mc.println-is-return
  concept: go.basics.println
  title: 출력을 반환으로 착각함
  statement: fmt.Println으로 출력하면 그 값이 어딘가에 저장된다고 생각한다.
  reality: fmt.Println은 화면에 보여 주기만 하고, 출력한 값을 저장해 두지 않는다.
- id: go.mc.const-reassign
  concept: go.vars.const
  title: const도 다시 대입할 수 있다고 생각함
  statement: const로 선언한 상수에도 나중에 다른 값을 대입할 수 있다고 생각한다.
  reality: const 상수에 다시 대입하면 컴파일 오류가 난다.
