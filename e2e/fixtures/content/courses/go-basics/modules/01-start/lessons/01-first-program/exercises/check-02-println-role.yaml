id: go-basics.start.first-program.check-println-role
usage: check
type: mcq_single
difficulty: 2
concepts:
  - { id: go.basics.println, weight: 1 }
estimatedSeconds: 40
prompt: |
  본문 확인: `fmt.Println("완료")`는 무슨 일을 하나요?
spec:
  options:
    - id: a
      text: 화면에 `완료`라는 글자가 보인다
    - id: b
      text: "`완료`라는 값이 저장되어 다음 줄에서 다시 쓸 수 있다"
      misconception: go.mc.println-is-return
      rationale: fmt.Println은 보여 주기만 하고 값을 저장하지 않아요.
    - id: c
      text: 프로그램이 끝난다
      rationale: fmt.Println은 출력만 할 뿐이에요.
  correct: a
misconceptions: [go.mc.println-is-return]
hints:
  - '`Println`은 "한 줄 출력(print line)"이라는 뜻이에요.'
  - fmt.Println은 사람이 볼 수 있게 보여 주는 일만 해요.
  - 출력은 저장과 다른 일이에요.
explanation: |
  정답은 **화면에 `완료`라는 글자가 보인다**예요. fmt.Println은 값을 화면에 보여 줄 뿐 저장하지 않아요.
origin: authored
review:
  status: draft
  draftedBy: ai:claude
