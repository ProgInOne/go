      misconception: go.mc.const-reassign
      rationale: const 상수에는 다시 대입할 수 없어요.
    - id: c
      text: '`limit`이 3 그대로 남고 아무 일도 없다'
      rationale: 조용히 무시되지 않고 컴파일 오류로 알려 줘요.
